name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, the day after Home Assistant's Wednesday betas, so the "next HA"
  # job catches a breaking beta before it's released.
  schedule:
    - cron: "17 14 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The next Home Assistant may break things that get fixed before its
    # release; it warns rather than fails the build.
    continue-on-error: ${{ matrix.next == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # requirements_test.txt: current Home Assistant.
          - name: current
          # Oldest supported Home Assistant (hacs.json) and its pyrainbird.
          - name: HA 2026.9
            pins: pytest-homeassistant-custom-component==0.13.367 pyrainbird==6.5.0
          # The newest build of the test package, which follows Home Assistant
          # betas: the next release while a beta is out, else the current one.
          - name: next HA
            next: true
            upgrade: pytest-homeassistant-custom-component
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --pre -r requirements_test.txt
      - if: matrix.pins
        run: pip install --pre ${{ matrix.pins }}
      - if: matrix.upgrade
        run: pip install --pre --upgrade ${{ matrix.upgrade }}
      - run: pip list | grep -iE "^(homeassistant|pyrainbird|pytest-homeassistant)"
      - run: ruff check . && ruff format --check .
      - run: node --test tests/test_panel_frontend.mjs
      - if: "!matrix.pins && !matrix.next"
        run: mypy custom_components/rainbird_extended
      - run: pytest --cov

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
